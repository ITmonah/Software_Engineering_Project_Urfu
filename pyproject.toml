[tool.black]
line-length = 88
target-version = ["py310"]
exclude = '''
/(
  \.venv
  | venv
  | \.git
  | __pycache__
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
